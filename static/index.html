<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenCode Providers Editor</title>
<style>
  /* ════════════════════════════════════════════════
     主题 Token — 黑白双主题（清新简约）
     白主题用墨黑做强调，黑主题用纸白做强调（反色）
     ════════════════════════════════════════════════ */
  :root {
    --bg: #F3F8F1;
    --surface: #FFFFFF;
    --surface2: #EDF5EA;
    --surface3: #E0EDDC;
    --border: #DFEADB;
    --border-strong: #C6D9C1;
    --ink: #1B2A1E;
    --ink-2: #46604B;
    --muted: #7E9280;
    --accent: #3E9B5F;
    --accent-contrast: #FFFFFF;
    --danger: #C24A45;
    --danger-hover: #D9605A;
    --success: #3F8F5E;
    --warning: #A8781E;
    --shadow-sm: 0 1px 2px rgba(28,60,34,.05);
    --shadow-md: 0 10px 28px rgba(28,60,34,.09);
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
            "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "SF Mono", "Cascadia Code", "Fira Code", Consolas,
            ui-monospace, "Courier New", monospace;
    --radius: 12px;
    --radius-sm: 8px;
  }
  :root[data-theme="dark"] {
    --bg: #0C120E;
    --surface: #121A14;
    --surface2: #18221B;
    --surface3: #1F2C22;
    --border: #233127;
    --border-strong: #354A3B;
    --ink: #E8F3E7;
    --ink-2: #A9C0AA;
    --muted: #7D967F;
    --accent: #74D192;
    --accent-contrast: #0B110D;
    --danger: #E07A74;
    --danger-hover: #EF928B;
    --success: #5CB87F;
    --warning: #D8A24A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 12px 30px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }

  ::selection { background: var(--accent); color: var(--accent-contrast); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand-mark {
    width: 30px; height: 30px; flex-shrink: 0;
    border-radius: 9px;
    background: var(--accent);
    color: var(--accent-contrast);
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 17px; height: 17px; }

  /* 线性图标 */
  .ico { width: 16px; height: 16px; flex-shrink: 0; display: block; }
  .ico-sm { width: 14px; height: 14px; }
  .ico-xs { width: 12px; height: 12px; }
  .with-ico { display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .with-ico .ico { width: 15px; height: 15px; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
  header .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; font-family: var(--mono); }

  /* 主题切换（签名元素：胶囊开关，反色滑块） */
  .theme-toggle {
    position: relative;
    width: 52px; height: 28px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: background .25s ease;
  }
  .theme-toggle:hover { border-color: var(--border-strong); }
  .theme-ico {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px;
    color: var(--muted);
    pointer-events: none;
    z-index: 0;
  }
  .theme-ico svg { width: 100%; height: 100%; display: block; }
  .theme-ico-moon { left: 8px; }
  .theme-ico-sun  { right: 8px; }
  .theme-thumb {
    position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent);
    z-index: 1;
    transition: transform .3s cubic-bezier(.4,.2,.2,1), background .3s ease, box-shadow .3s ease;
  }
  :root[data-theme="dark"] .theme-thumb {
    transform: translateX(24px);
    background: var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }

  .tab-bar { display: flex; gap: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .tab-btn {
    padding: 5px 16px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  /* ── Layout ── */
  .workspace { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  aside {
    width: 272px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-wrap { position: relative; flex: 1; display: flex; align-items: center; }
  .search-wrap .search-icon {
    position: absolute; left: 10px;
    width: 14px; height: 14px;
    color: var(--muted); pointer-events: none;
  }
  .search-wrap .search-icon svg { width: 100%; height: 100%; display: block; }
  .sidebar-header input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 7px 10px 7px 30px;
    color: var(--ink);
    font-size: 13px;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .sidebar-header input::placeholder { color: var(--muted); }
  .sidebar-header input:focus { border-color: var(--border-strong); background: var(--bg); }
  .btn-icon {
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--accent-contrast);
    width: 32px; height: 32px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .15s ease, opacity .15s ease;
    flex-shrink: 0;
  }
  .btn-icon svg { width: 17px; height: 17px; }
  .btn-icon:hover { transform: translateY(-1px); opacity: .9; }

  .provider-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .provider-item {
    padding: 10px 12px 10px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .12s ease;
    position: relative;
  }
  .provider-item::before {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleY(0);
    width: 3px; height: 60%; border-radius: 3px;
    background: var(--accent);
    transition: transform .18s ease;
  }
  .provider-item:hover { background: var(--surface2); }
  .provider-item.active { background: var(--accent); color: var(--accent-contrast); }
  .provider-item.active::before { transform: translateY(-50%) scaleY(1); }
  .provider-item .name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .provider-item .id  { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
  .provider-item.active .id { color: var(--accent-contrast); opacity: .75; }
  .provider-item .item-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity .15s ease;
    flex-shrink: 0;
  }
  .provider-item:hover .item-actions { opacity: 1; }
  .provider-item .copy-btn, .provider-item .del-btn {
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    width: 26px; height: 26px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background .15s, color .15s;
    flex-shrink: 0;
  }
  .provider-item .copy-btn svg, .provider-item .del-btn svg { width: 14px; height: 14px; }
  .provider-item .copy-btn:hover { background: var(--accent); color: var(--accent-contrast); }
  .provider-item .del-btn:hover  { background: var(--danger); color: #fff; }
  .provider-item.active .copy-btn, .provider-item.active .del-btn { color: var(--accent-contrast); opacity: .8; }
  .provider-item.active .copy-btn:hover, .provider-item.active .del-btn:hover { opacity: 1; }
  .provider-item.active .copy-btn:hover { background: var(--accent-contrast); color: var(--accent); }

  /* ── Main panel ── */
  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* ── View: visual ── */
  #view-visual {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .panel-title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 4px; }
  .panel-subtitle { font-size: 12px; color: var(--muted); font-family: var(--mono); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .card-header {
    background: var(--surface2);
    padding: 12px 18px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .card-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

  .form-row { display: flex; gap: 12px; align-items: center; }
  .form-row label { width: 96px; font-size: 13px; color: var(--ink-2); flex-shrink: 0; font-weight: 500; }
  .form-row input, .form-row select {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    color: var(--ink);
    font-size: 13px;
    font-family: var(--mono);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .form-row input:hover, .form-row select:hover { border-color: var(--border-strong); }
  .form-row input:focus, .form-row select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
  .form-row input::placeholder { color: var(--muted); }

  /* Models */
  .models-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .models-header span { font-size: 13px; color: var(--muted); }
  .models-actions { display: flex; gap: 8px; }
  .btn-sm {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .btn-sm svg { width: 13px; height: 13px; }
  .btn-sm.danger { border-color: transparent; color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, transparent); }
  .btn-sm.danger:hover { background: var(--danger); color: #fff; }
  .btn-sm.warning { border-color: transparent; color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, transparent); }
  .btn-sm.warning:hover { background: var(--warning); color: #fff; }

  .model-row {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .model-row:last-child { border-bottom: none; }
  .model-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--ink);
    font-size: 12px;
    font-family: var(--mono);
    outline: none;
    transition: border-color .15s;
    flex: 1;
    min-width: 0;
  }
  .model-row input:focus { border-color: var(--accent); }
  .model-row label { font-size: 12px; color: var(--muted); width: 62px; flex-shrink: 0; }

  /* Action bar */
  .action-bar {
    padding: 16px 28px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  .btn-primary {
    padding: 9px 22px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: opacity .15s, transform .15s;
  }
  .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .45; cursor: default; transform: none; }
  .btn-secondary {
    padding: 9px 22px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    font-size: 14px;
    transition: all .15s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* ── View: raw JSON ── */
  #view-raw { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #raw-editor {
    flex: 1;
    background: var(--bg);
    border: none;
    color: var(--ink-2);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    padding: 24px;
    resize: none;
    outline: none;
    overflow: auto;
    tab-size: 2;
  }
  .raw-status {
    padding: 8px 24px;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .raw-status.err { color: var(--danger); }
  .raw-status.ok  { color: var(--success); }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    text-align: center;
  }
  .empty-state .icon {
    width: 64px; height: 64px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    box-shadow: var(--shadow-sm);
    color: var(--muted);
  }
  .empty-state .icon svg { width: 30px; height: 30px; }
  .empty-state p { font-size: 14px; color: var(--ink-2); }
  .empty-state .hint { font-size: 12px; color: var(--muted); }
  .empty-state .hint strong { color: var(--accent); }

  /* ── Add-provider modal ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(24,52,30,.35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  :root[data-theme="dark"] .overlay { background: rgba(0,0,0,.5); }
  .overlay.show { display: flex; animation: overlayIn .18s ease; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 440px;
    max-width: 100%;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: var(--shadow-md);
    animation: modalIn .2s cubic-bezier(.3,.8,.3,1);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .modal .form-row label { width: 84px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }

  /* ── Toast ── */
  .toast-container {
    position: fixed;
    bottom: 26px;
    right: 26px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 200;
  }
  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 13px;
    color: var(--ink);
    min-width: 220px;
    max-width: 340px;
    box-shadow: var(--shadow-md);
    animation: toastIn .25s cubic-bezier(.3,.8,.3,1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.success { border-color: var(--success); }
  .toast.error   { border-color: var(--danger); }
  .toast-ico { width: 16px; height: 16px; flex-shrink: 0; }
  .toast.success .toast-ico { color: var(--success); }
  .toast.error   .toast-ico { color: var(--danger); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: padding-box; }

  /* ── Fetch-models modal ── */
  #fetch-modal .modal { width: 540px; max-height: 88vh; }
  .fetch-search-wrap { position: relative; display: flex; align-items: center; }
  .fetch-search-wrap .search-icon {
    position: absolute; left: 11px;
    width: 14px; height: 14px;
    color: var(--muted); pointer-events: none;
  }
  .fetch-search-wrap .search-icon svg { width: 100%; height: 100%; display: block; }
  .fetch-search-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px 8px 34px;
    color: var(--ink);
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .fetch-search-wrap input:focus { border-color: var(--accent); }

  .model-pick-list {
    overflow-y: auto;
    max-height: 300px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
  }
  .model-pick-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .1s;
    user-select: none;
  }
  .model-pick-item:last-child { border-bottom: none; }
  .model-pick-item:hover { background: var(--surface2); }
  .model-pick-item input[type=checkbox] {
    width: 15px; height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .model-pick-item .pick-id {
    flex: 1;
    font-family: var(--mono);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .model-pick-item .pick-owner {
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .pick-empty {
    padding: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .fetch-toolbar { display: flex; align-items: center; gap: 8px; }
  .fetch-toolbar .pick-count { font-size: 12px; color: var(--muted); flex: 1; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }

  /* ── Responsive ── */
  @media (max-width: 760px) {
    header { flex-wrap: wrap; }
    header .meta { max-width: 100%; order: 3; flex-basis: 100%; }
    aside { width: 200px; min-width: 160px; }
    #view-visual { padding: 20px; }
    .form-row { flex-direction: column; align-items: stretch; gap: 6px; }
    .form-row label { width: auto; }
    .model-row { flex-wrap: wrap; }
    .model-row label { width: auto; }
  }

  /* 减少动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
<script>
  /* 尽早设置主题，避免闪烁（跟随系统偏好 + 记忆选择） */
  (function () {
    try {
      var saved = localStorage.getItem('opencode-editor-theme');
      var dark = saved === 'dark' ||
        (saved === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    <h1>Providers Editor</h1>
  </div>
  <span class="meta" id="config-path-label"></span>
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题" title="切换浅色 / 深色主题">
    <span class="theme-ico theme-ico-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
    <span class="theme-thumb"></span>
    <span class="theme-ico theme-ico-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
  </button>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('visual')">可视化编辑</button>
    <button class="tab-btn" onclick="switchTab('raw')">原始 JSON</button>
  </div>
</header>

<!-- ── Workspace ── -->
<div class="workspace">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-header">
      <div class="search-wrap">
        <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input id="search-input" type="text" placeholder="搜索 provider…" oninput="renderList()" />
      </div>
      <button class="btn-icon" title="新增 Provider" onclick="openAddModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="provider-list" id="provider-list"></div>
  </aside>

  <!-- Main -->
  <main>
    <!-- Visual View -->
    <div id="view-visual" style="display:flex">
      <div class="empty-state" id="empty-state">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
        <p>从左侧选择一个 Provider 进行编辑</p>
        <p class="hint">或点击 <strong>＋</strong> 新增</p>
      </div>
      <div id="edit-panel" style="display:none; flex-direction:column; gap:20px;">
        <!-- Basic Info -->
        <div>
          <div class="panel-title" id="edit-title"></div>
          <div class="panel-subtitle" id="edit-id-label"></div>
        </div>

        <div class="card">
          <div class="card-header">基本信息</div>
          <div class="card-body">
            <div class="form-row">
              <label>显示名称</label>
              <input id="f-name" type="text" placeholder="e.g. My Provider" />
            </div>
            <div class="form-row">
              <label>Package</label>
              <input id="f-package" type="text" class="wide" value="@opencode/ai/providers/openai-compatible" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Settings（API 配置）</div>
          <div class="card-body">
            <div class="form-row">
              <label>API Key</label>
              <input id="f-apikey" type="text" class="wide" placeholder="sk-…" />
            </div>
            <div class="form-row">
              <label>Base URL</label>
              <input id="f-baseurl" type="text" class="wide" placeholder="https://api.example.com/v1" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Models</div>
          <div class="card-body">
            <div class="models-header">
              <span id="model-count">0 个模型</span>
              <div class="models-actions">
                <button class="btn-sm warning with-ico" id="fetch-btn" onclick="openFetchModal()" title="从 Base URL 拉取可用模型列表"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>获取模型</button>
                <button class="btn-sm with-ico" onclick="addModelRow()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加模型</button>
              </div>
            </div>
            <div id="models-container"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Raw JSON View -->
    <div id="view-raw" style="display:none">
      <textarea id="raw-editor" spellcheck="false"
        oninput="onRawInput()" onkeydown="handleRawTab(event)"></textarea>
      <div class="raw-status" id="raw-status">就绪</div>
    </div>

    <!-- Action bar -->
    <div class="action-bar">
      <button class="btn-primary with-ico" id="save-btn" onclick="save()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>保存</button>
      <button class="btn-secondary with-ico" onclick="reload()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>重新加载</button>
      <span id="save-status" style="font-size:12px; color:var(--muted); align-self:center;"></span>
    </div>
  </main>
</div>

<!-- ── Add Provider Modal ── -->
<div class="overlay" id="add-modal">
  <div class="modal">
    <h3><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增 Provider</h3>
    <div class="form-row"><label>ID（键名）</label><input id="m-id" type="text" placeholder="my-provider" /></div>
    <div class="form-row"><label>名称</label><input id="m-name" type="text" placeholder="My Provider" /></div>
    <div class="form-row"><label>Package</label><input id="m-package" type="text" value="@opencode/ai/providers/openai-compatible" /></div>
    <div class="form-row"><label>API Key</label><input id="m-apikey" type="text" placeholder="sk-…" /></div>
    <div class="form-row"><label>Base URL</label><input id="m-baseurl" type="text" placeholder="https://…/v1" /></div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeAddModal()">取消</button>
      <button class="btn-primary" onclick="confirmAdd()">添加</button>
    </div>
  </div>
</div>

<!-- ── Copy Provider Modal ── -->
<div class="overlay" id="copy-modal">
  <div class="modal">
    <h3><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制 Provider</h3>
    <div style="font-size:12px;color:var(--muted);margin-top:-4px" id="copy-source-label"></div>
    <div class="form-row">
      <label>新 ID</label>
      <input id="copy-new-id" type="text" placeholder="new-provider-id"
             oninput="validateCopyId()" />
    </div>
    <div class="form-row">
      <label>新名称</label>
      <input id="copy-new-name" type="text" placeholder="New Provider Name" />
    </div>
    <div id="copy-id-error" style="font-size:12px;color:var(--danger);min-height:16px;margin-top:-4px"></div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeCopyModal()">取消</button>
      <button class="btn-primary" id="copy-confirm-btn" onclick="confirmCopy()">复制</button>
    </div>
  </div>
</div>

<!-- ── Fetch Models Modal ── -->
<div class="overlay" id="fetch-modal">
  <div class="modal" style="gap:14px">
    <div style="display:flex;align-items:center;gap:10px">
      <h3 style="flex:1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>从接口获取模型</h3>
      <span id="fetch-spinner" class="spinner" style="display:none"></span>
    </div>
    <div style="font-size:12px;color:var(--muted)" id="fetch-url-label"></div>

    <!-- Search -->
    <div class="fetch-search-wrap">
      <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input id="fetch-search" type="text" placeholder="搜索模型 ID…" oninput="filterPickList()" />
    </div>

    <!-- Toolbar: select all / count -->
    <div class="fetch-toolbar">
      <button class="btn-sm" onclick="pickToggleAll(true)">全选</button>
      <button class="btn-sm" onclick="pickToggleAll(false)">取消全选</button>
      <span class="pick-count" id="pick-count">0 个模型</span>
      <span id="pick-selected-count" style="font-size:12px;color:var(--accent)"></span>
    </div>

    <!-- List -->
    <div class="model-pick-list" id="model-pick-list">
      <div class="pick-empty">点击「获取」按钮拉取模型列表</div>
    </div>

    <div class="modal-actions">
      <button class="btn-sm" onclick="closeFetchModal()">取消</button>
      <button class="btn-primary" onclick="confirmFetchModels()" id="pick-confirm-btn" disabled>添加选中模型</button>
    </div>
  </div>
</div>

<!-- ── Toast Container ── -->
<div class="toast-container" id="toast-container"></div>

<script>
// ════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════
let fullConfig = {};       // complete opencode.json
let providers = {};        // shorthand
let activeId = null;       // currently selected provider id
let currentTab = 'visual'; // 'visual' | 'raw'

// ════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════
async function init() {
  await reload();
}

// ── 主题切换 ──
function toggleTheme() {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('opencode-editor-theme', next); } catch (e) {}
}

async function reload() {
  try {
    const res = await fetch('/api/config');
    fullConfig = await res.json();
    providers = fullConfig.providers || {};
    renderList();
    if (activeId && providers[activeId]) {
      loadProvider(activeId);
    } else {
      activeId = null;
      showEmptyState();
    }
    if (currentTab === 'raw') syncRawFromConfig();
    showToast('配置已加载', 'success', 2000);
  } catch(e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

// ════════════════════════════════════════════════
// Sidebar list
// ════════════════════════════════════════════════
function renderList() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const list  = document.getElementById('provider-list');
  list.innerHTML = '';

  const ids = Object.keys(providers).sort();
  const filtered = query
    ? ids.filter(id => id.toLowerCase().includes(query) || (providers[id].name||'').toLowerCase().includes(query))
    : ids;

  filtered.forEach(id => {
    const p = providers[id];
    const div = document.createElement('div');
    div.className = 'provider-item' + (id === activeId ? ' active' : '');
    div.innerHTML = `
      <div style="flex:1;min-width:0">
        <div class="name">${p.name || id}</div>
        <div class="id">${id}</div>
      </div>
      <div class="item-actions">
        <button class="copy-btn" title="复制此 Provider" onclick="openCopyModal(event,'${id}')">${icon('copy')}</button>
        <button class="del-btn"  title="删除此 Provider" onclick="deleteProvider(event,'${id}')">${icon('trash')}</button>
      </div>
    `;
    div.onclick = (e) => {
      if (e.target.closest('.item-actions')) return;
      selectProvider(id);
    };
    list.appendChild(div);
  });
}

// ════════════════════════════════════════════════
// Provider select / edit
// ════════════════════════════════════════════════
function selectProvider(id) {
  if (currentTab === 'raw') return;  // raw mode: no sidebar selection
  saveCurrentEdits();  // auto-save current before switching
  activeId = id;
  renderList();
  loadProvider(id);
}

function loadProvider(id) {
  const p = providers[id] || {};
  document.getElementById('empty-state').style.display = 'none';
  const panel = document.getElementById('edit-panel');
  panel.style.display = 'flex';

  document.getElementById('edit-title').textContent = p.name || id;
  document.getElementById('edit-id-label').textContent = `ID: ${id}`;
  document.getElementById('f-name').value    = p.name    || '';
  document.getElementById('f-package').value = p.package || '@opencode/ai/providers/openai-compatible';
  const s = p.settings || {};
  document.getElementById('f-apikey').value  = s.apiKey  || '';
  document.getElementById('f-baseurl').value = s.baseURL || '';

  renderModels(p.models || {});
}

function showEmptyState() {
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('edit-panel').style.display  = 'none';
}

// ════════════════════════════════════════════════
// Models
// ════════════════════════════════════════════════
function renderModels(models) {
  const container = document.getElementById('models-container');
  container.innerHTML = '';
  const entries = Object.entries(models);
  document.getElementById('model-count').textContent = entries.length + ' 个模型';
  entries.forEach(([modelId, meta]) => {
    container.appendChild(makeModelRow(modelId, meta.name || ''));
  });
}

function makeModelRow(modelId, displayName) {
  const row = document.createElement('div');
  row.className = 'model-row';
  row.innerHTML = `
    <label>Model ID</label>
    <input type="text" class="model-id" value="${escHtml(modelId)}" placeholder="model-id" />
    <label>别名</label>
    <input type="text" class="model-name" value="${escHtml(displayName)}" placeholder="（可选）" />
    <button class="btn-sm danger" onclick="this.closest('.model-row').remove(); updateModelCount()">${icon('x','ico-xs')}</button>
  `;
  return row;
}

function addModelRow() {
  const container = document.getElementById('models-container');
  container.appendChild(makeModelRow('', ''));
  updateModelCount();
}

function updateModelCount() {
  const n = document.querySelectorAll('.model-row').length;
  document.getElementById('model-count').textContent = n + ' 个模型';
}

// ════════════════════════════════════════════════
// Collect form data
// ════════════════════════════════════════════════
function collectCurrentProvider() {
  if (!activeId) return null;
  const models = {};
  document.querySelectorAll('.model-row').forEach(row => {
    const mid  = row.querySelector('.model-id').value.trim();
    const mname = row.querySelector('.model-name').value.trim();
    if (mid) models[mid] = mname ? { name: mname } : {};
  });
  return {
    name:    document.getElementById('f-name').value.trim(),
    package: document.getElementById('f-package').value.trim(),
    settings: {
      apiKey:  document.getElementById('f-apikey').value.trim(),
      baseURL: document.getElementById('f-baseurl').value.trim(),
    },
    models,
  };
}

function saveCurrentEdits() {
  if (!activeId) return;
  const data = collectCurrentProvider();
  if (data) providers[activeId] = data;
}

// ════════════════════════════════════════════════
// Delete provider
// ════════════════════════════════════════════════
async function deleteProvider(e, id) {
  e.stopPropagation();
  if (!confirm(`确定删除 Provider「${providers[id]?.name || id}」吗？`)) return;
  try {
    const res = await fetch(`/api/providers/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());
    delete providers[id];
    if (activeId === id) { activeId = null; showEmptyState(); }
    renderList();
    showToast(`已删除 ${id}`, 'success');
  } catch(ex) {
    showToast('删除失败: ' + ex.message, 'error');
  }
}

// ════════════════════════════════════════════════
// Copy Provider
// ════════════════════════════════════════════════
let copySourceId = null;

function openCopyModal(e, id) {
  e.stopPropagation();
  copySourceId = id;
  const src = providers[id];

  // Pre-fill: suggest "<id>-copy", increment if already exists
  let newId = `${id}-copy`;
  let n = 2;
  while (providers[newId]) { newId = `${id}-copy-${n++}`; }

  document.getElementById('copy-new-id').value   = newId;
  document.getElementById('copy-new-name').value = src?.name ? `${src.name} (副本)` : newId;
  document.getElementById('copy-source-label').textContent = `来源：${src?.name || id}（${id}）`;
  document.getElementById('copy-id-error').textContent = '';
  document.getElementById('copy-confirm-btn').disabled = false;
  document.getElementById('copy-modal').classList.add('show');
  document.getElementById('copy-new-id').focus();
  document.getElementById('copy-new-id').select();
}

function closeCopyModal() {
  document.getElementById('copy-modal').classList.remove('show');
  copySourceId = null;
}

function validateCopyId() {
  const val = document.getElementById('copy-new-id').value.trim();
  const errEl = document.getElementById('copy-id-error');
  const btn   = document.getElementById('copy-confirm-btn');
  if (!val) {
    errEl.textContent = 'ID 不能为空';
    btn.disabled = true;
  } else if (providers[val]) {
    errEl.textContent = `ID「${val}」已存在`;
    btn.disabled = true;
  } else {
    errEl.textContent = '';
    btn.disabled = false;
  }
}

async function confirmCopy() {
  if (!copySourceId) return;
  const newId   = document.getElementById('copy-new-id').value.trim();
  const newName = document.getElementById('copy-new-name').value.trim();
  if (!newId)          { document.getElementById('copy-id-error').textContent = 'ID 不能为空'; return; }
  if (providers[newId]) { document.getElementById('copy-id-error').textContent = `ID「${newId}」已存在`; return; }

  // Deep-clone the source, apply new name
  const cloned = JSON.parse(JSON.stringify(providers[copySourceId]));
  if (newName) cloned.name = newName;

  try {
    const res = await fetch(`/api/providers/${encodeURIComponent(newId)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cloned),
    });
    if (!res.ok) throw new Error(await res.text());
    providers[newId] = cloned;
    closeCopyModal();
    renderList();
    // Save current edits first, then switch to the new copy
    saveCurrentEdits();
    activeId = newId;
    renderList();
    loadProvider(newId);
    showToast(`已复制为「${newId}」`, 'success');
  } catch(ex) {
    showToast('复制失败: ' + ex.message, 'error');
  }
}

// ════════════════════════════════════════════════
// Add Provider Modal
// ════════════════════════════════════════════════
function openAddModal() {
  document.getElementById('m-id').value = '';
  document.getElementById('m-name').value = '';
  document.getElementById('m-apikey').value = '';
  document.getElementById('m-baseurl').value = '';
  document.getElementById('add-modal').classList.add('show');
  document.getElementById('m-id').focus();
}
function closeAddModal() {
  document.getElementById('add-modal').classList.remove('show');
}
async function confirmAdd() {
  const id      = document.getElementById('m-id').value.trim();
  const name    = document.getElementById('m-name').value.trim();
  const pkg     = document.getElementById('m-package').value.trim();
  const apiKey  = document.getElementById('m-apikey').value.trim();
  const baseURL = document.getElementById('m-baseurl').value.trim();
  if (!id) { alert('ID 不能为空'); return; }
  if (!name) { alert('名称不能为空'); return; }

  const body = { name, package: pkg, settings: { apiKey, baseURL }, models: {} };
  try {
    const res = await fetch(`/api/providers/${encodeURIComponent(id)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    providers[id] = body;
    closeAddModal();
    renderList();
    selectProvider(id);
    showToast(`已添加 ${name}`, 'success');
  } catch(ex) {
    showToast('添加失败: ' + ex.message, 'error');
  }
}

// ════════════════════════════════════════════════
// Save
// ════════════════════════════════════════════════
async function save() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;

  try {
    if (currentTab === 'visual') {
      saveCurrentEdits();
      fullConfig.providers = providers;
      const res = await fetch('/api/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fullConfig),
      });
      if (!res.ok) throw new Error(await res.text());
    } else {
      // raw mode
      const text = document.getElementById('raw-editor').value;
      let parsed;
      try { parsed = JSON.parse(text); }
      catch(e) { showToast('JSON 格式错误，无法保存', 'error'); btn.disabled=false; return; }
      const res = await fetch('/api/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(parsed),
      });
      if (!res.ok) throw new Error(await res.text());
      fullConfig = parsed;
      providers  = fullConfig.providers || {};
      renderList();
    }
    setStatus('已保存 ' + new Date().toLocaleTimeString());
    showToast('保存成功', 'success');
  } catch(ex) {
    showToast('保存失败: ' + ex.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(msg) {
  document.getElementById('save-status').textContent = msg;
}

// ════════════════════════════════════════════════
// Tab switch
// ════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (tab==='visual' && i===0) || (tab==='raw' && i===1));
  });
  document.getElementById('view-visual').style.display = tab === 'visual' ? 'flex' : 'none';
  document.getElementById('view-raw').style.display    = tab === 'raw'    ? 'flex' : 'none';
  if (tab === 'raw') {
    saveCurrentEdits();
    fullConfig.providers = providers;
    syncRawFromConfig();
  }
}

function syncRawFromConfig() {
  document.getElementById('raw-editor').value = JSON.stringify(fullConfig, null, 2);
  validateRaw();
}

// ════════════════════════════════════════════════
// Raw editor
// ════════════════════════════════════════════════
function onRawInput() { validateRaw(); }

function validateRaw() {
  const text   = document.getElementById('raw-editor').value;
  const status = document.getElementById('raw-status');
  try {
    JSON.parse(text);
    status.textContent = 'JSON 合法';
    status.className   = 'raw-status ok';
  } catch(e) {
    status.textContent = e.message;
    status.className   = 'raw-status err';
  }
}

function handleRawTab(e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const ta = e.target;
  const start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + '  ' + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = start + 2;
}

// ════════════════════════════════════════════════
// Toast
// ════════════════════════════════════════════════
function showToast(msg, type='', duration=3000) {
  const c    = document.getElementById('toast-container');
  const div  = document.createElement('div');
  div.className = 'toast ' + type;
  const ic = type === 'success'
    ? '<svg class="toast-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>'
    : '<svg class="toast-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  div.innerHTML = ic + '<span>' + escHtml(msg) + '</span>';
  c.appendChild(div);
  setTimeout(() => div.remove(), duration);
}

// ════════════════════════════════════════════════
// Helpers
// ════════════════════════════════════════════════
// 图标库（内联 SVG，随 currentColor 适配主题）
const ICON_PATHS = {
  copy:  '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
  x:     '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
};
function icon(name, cls='ico') {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]}</svg>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Close modal on overlay click
document.getElementById('add-modal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  if (e.key === 'Escape') { closeAddModal(); closeCopyModal(); closeFetchModal(); }
});

// ════════════════════════════════════════════════
// Fetch Models from API
// ════════════════════════════════════════════════
let fetchedModels = [];   // full list from API
let filteredModels = [];  // after search filter

function openFetchModal() {
  const baseURL = document.getElementById('f-baseurl').value.trim();
  if (!baseURL) {
    showToast('请先填写 Base URL', 'error');
    return;
  }
  document.getElementById('fetch-url-label').textContent = `接口：${baseURL}/models`;
  document.getElementById('fetch-search').value = '';
  document.getElementById('fetch-modal').classList.add('show');
  fetchModels(baseURL);
}

function closeFetchModal() {
  document.getElementById('fetch-modal').classList.remove('show');
}

async function fetchModels(baseURL) {
  const spinner = document.getElementById('fetch-spinner');
  const list    = document.getElementById('model-pick-list');
  const confirmBtn = document.getElementById('pick-confirm-btn');
  spinner.style.display = 'inline-block';
  confirmBtn.disabled   = true;
  list.innerHTML = '<div class="pick-empty">正在请求…</div>';

  const apiKey = document.getElementById('f-apikey').value.trim();
  try {
    // Use backend proxy to avoid CORS
    const res = await fetch('/api/proxy/models', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ baseURL, apiKey }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));

    fetchedModels = (data.data || data.models || data || [])
      .map(m => typeof m === 'string' ? { id: m } : m)
      .filter(m => m.id)
      .sort((a, b) => a.id.localeCompare(b.id));

    filterPickList();
    showToast(`获取到 ${fetchedModels.length} 个模型`, 'success');
  } catch(e) {
    list.innerHTML = `<div class="pick-empty" style="color:var(--danger)">请求失败：${escHtml(e.message)}</div>`;
    showToast('获取模型失败', 'error');
  } finally {
    spinner.style.display = 'none';
  }
}

function filterPickList() {
  const q = document.getElementById('fetch-search').value.toLowerCase();
  filteredModels = q
    ? fetchedModels.filter(m => m.id.toLowerCase().includes(q) || (m.owned_by||'').toLowerCase().includes(q))
    : fetchedModels;
  renderPickList();
}

function renderPickList() {
  const list = document.getElementById('model-pick-list');
  const confirmBtn = document.getElementById('pick-confirm-btn');

  if (filteredModels.length === 0) {
    list.innerHTML = fetchedModels.length === 0
      ? '<div class="pick-empty">暂无数据</div>'
      : '<div class="pick-empty">无匹配结果</div>';
    confirmBtn.disabled = true;
    document.getElementById('pick-count').textContent = '0 个模型';
    return;
  }

  // Get currently checked model IDs (preserve across re-render)
  const prevChecked = new Set(
    [...document.querySelectorAll('.pick-cb:checked')].map(cb => cb.dataset.id)
  );

  list.innerHTML = '';
  filteredModels.forEach(m => {
    const item = document.createElement('label');
    item.className = 'model-pick-item';
    const checked = prevChecked.has(m.id);
    item.innerHTML = `
      <input type="checkbox" class="pick-cb" data-id="${escHtml(m.id)}" ${checked ? 'checked' : ''} onchange="updatePickCount()" />
      <span class="pick-id">${escHtml(m.id)}</span>
      ${m.owned_by ? `<span class="pick-owner">${escHtml(m.owned_by)}</span>` : ''}
    `;
    list.appendChild(item);
  });

  document.getElementById('pick-count').textContent = `共 ${filteredModels.length} 个`;
  confirmBtn.disabled = false;
  updatePickCount();
}

function updatePickCount() {
  const n = document.querySelectorAll('.pick-cb:checked').length;
  const el = document.getElementById('pick-selected-count');
  el.textContent = n > 0 ? `已选 ${n} 个` : '';
  document.getElementById('pick-confirm-btn').disabled = (n === 0);
}

function pickToggleAll(checked) {
  document.querySelectorAll('.pick-cb').forEach(cb => cb.checked = checked);
  updatePickCount();
}

function confirmFetchModels() {
  const checked = [...document.querySelectorAll('.pick-cb:checked')].map(cb => cb.dataset.id);
  if (checked.length === 0) return;

  // Get existing model IDs to avoid duplicates
  const existing = new Set(
    [...document.querySelectorAll('.model-row .model-id')].map(el => el.value.trim())
  );
  const container = document.getElementById('models-container');
  let added = 0;
  checked.forEach(id => {
    if (!existing.has(id)) {
      container.appendChild(makeModelRow(id, ''));
      added++;
    }
  });
  updateModelCount();
  closeFetchModal();
  showToast(`已添加 ${added} 个模型${added < checked.length ? `（${checked.length - added} 个已存在）` : ''}`, 'success');
}

// ════════════════════════════════════════════════
// Boot
// ════════════════════════════════════════════════
init();
</script>
