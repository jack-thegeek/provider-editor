<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenCode Providers Editor</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2d3147;
    --accent: #6c8ef5;
    --accent-hover: #8aa4ff;
    --danger: #e05c6c;
    --danger-hover: #f07080;
    --success: #4caf80;
    --text: #e2e6f0;
    --text-muted: #8891a8;
    --font: 'Segoe UI', 'Inter', system-ui, sans-serif;
    --mono: 'Cascadia Code', 'Consolas', 'Fira Code', monospace;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    flex: 1;
  }
  header .meta { font-size: 12px; color: var(--text-muted); }
  .tab-bar { display: flex; gap: 4px; }
  .tab-btn {
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
  }
  .tab-btn.active, .tab-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ── Layout ── */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  aside {
    width: 260px;
    min-width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .sidebar-header input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .sidebar-header input:focus { border-color: var(--accent); }
  .btn-icon {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: background .15s;
  }
  .btn-icon:hover { background: var(--accent-hover); }

  .provider-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }
  .provider-item {
    padding: 10px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .12s;
    position: relative;
  }
  .provider-item:hover { background: var(--surface2); }
  .provider-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
  .provider-item .name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .provider-item .id  { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .provider-item .item-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity .15s;
    flex-shrink: 0;
  }
  .provider-item:hover .item-actions { opacity: 1; }
  .provider-item .copy-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    padding: 2px 6px;
    cursor: pointer;
    font-size: 11px;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .provider-item .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .provider-item .del-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--text-muted);
    padding: 2px 6px;
    cursor: pointer;
    font-size: 11px;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .provider-item .del-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* ── Main panel ── */
  main {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── View: visual ── */
  #view-visual {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .panel-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .panel-subtitle { font-size: 12px; color: var(--text-muted); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header {
    background: var(--surface2);
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .card-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .form-row { display: flex; gap: 12px; align-items: center; }
  .form-row label { width: 90px; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
  .form-row input, .form-row select {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--mono);
    outline: none;
    transition: border-color .15s;
  }
  .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
  .form-row input.wide { font-family: var(--mono); }

  /* Models table */
  .models-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .models-header span { font-size: 12px; color: var(--text-muted); }
  .btn-sm {
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    transition: all .15s;
  }
  .btn-sm:hover { background: var(--accent); color: #fff; }
  .btn-sm.danger { border-color: var(--danger); color: var(--danger); }
  .btn-sm.danger:hover { background: var(--danger); color: #fff; }

  .model-row {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .model-row:last-child { border-bottom: none; }
  .model-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    color: var(--text);
    font-size: 12px;
    font-family: var(--mono);
    outline: none;
    flex: 1;
  }
  .model-row input:focus { border-color: var(--accent); }
  .model-row label { font-size: 11px; color: var(--text-muted); width: 50px; flex-shrink: 0; }

  /* Action bar */
  .action-bar {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .btn-primary {
    padding: 8px 20px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  /* ── View: raw JSON ── */
  #view-raw {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #raw-editor {
    flex: 1;
    background: var(--bg);
    border: none;
    color: #a8d8a8;
    font-family: var(--mono);
    font-size: 13px;
    padding: 20px;
    resize: none;
    outline: none;
    overflow: auto;
    tab-size: 2;
  }
  .raw-status {
    padding: 6px 20px;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .raw-status.err { color: var(--danger); }
  .raw-status.ok  { color: var(--success); }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; }
  .empty-state p { font-size: 14px; }

  /* ── Add-provider modal ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 420px;
    max-width: 95vw;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .modal h3 { font-size: 16px; }
  .modal .form-row label { width: 80px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  /* ── Toast ── */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 200;
  }
  .toast {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    min-width: 220px;
    animation: fadeIn .2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.success { border-color: var(--success); }
  .toast.error   { border-color: var(--danger); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Fetch-models modal ── */
  #fetch-modal .modal { width: 520px; max-height: 85vh; }
  .fetch-search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .fetch-search-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px 7px 32px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .fetch-search-wrap input:focus { border-color: var(--accent); }
  .fetch-search-wrap .search-icon {
    position: absolute;
    left: 9px;
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
  }

  .model-pick-list {
    overflow-y: auto;
    max-height: 320px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
  }
  .model-pick-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .1s;
    user-select: none;
  }
  .model-pick-item:last-child { border-bottom: none; }
  .model-pick-item:hover { background: var(--surface2); }
  .model-pick-item input[type=checkbox] {
    width: 15px; height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .model-pick-item .pick-id {
    flex: 1;
    font-family: var(--mono);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .model-pick-item .pick-owner {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .pick-empty {
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .fetch-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .fetch-toolbar .pick-count {
    font-size: 12px;
    color: var(--text-muted);
    flex: 1;
  }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  .btn-sm.warning {
    border-color: #e0a030;
    color: #e0a030;
  }
  .btn-sm.warning:hover { background: #e0a030; color: #fff; }
</style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <h1>⚙️ OpenCode Providers Editor</h1>
  <span class="meta" id="config-path-label"></span>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('visual')">可视化编辑</button>
    <button class="tab-btn" onclick="switchTab('raw')">原始 JSON</button>
  </div>
</header>

<!-- ── Workspace ── -->
<div class="workspace">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-header">
      <input id="search-input" type="text" placeholder="搜索 provider…" oninput="renderList()" />
      <button class="btn-icon" title="新增 Provider" onclick="openAddModal()">＋</button>
    </div>
    <div class="provider-list" id="provider-list"></div>
  </aside>

  <!-- Main -->
  <main>
    <!-- Visual View -->
    <div id="view-visual" style="display:flex">
      <div class="empty-state" id="empty-state">
        <div class="icon">📦</div>
        <p>从左侧选择一个 Provider 进行编辑</p>
        <p style="font-size:12px">或点击 <strong>＋</strong> 新增</p>
      </div>
      <div id="edit-panel" style="display:none; flex-direction:column; gap:20px;">
        <!-- Basic Info -->
        <div>
          <div class="panel-title" id="edit-title"></div>
          <div class="panel-subtitle" id="edit-id-label"></div>
        </div>

        <div class="card">
          <div class="card-header">基本信息</div>
          <div class="card-body">
            <div class="form-row">
              <label>显示名称</label>
              <input id="f-name" type="text" placeholder="e.g. My Provider" />
            </div>
            <div class="form-row">
              <label>Package</label>
              <input id="f-package" type="text" class="wide" value="@opencode/ai/providers/openai-compatible" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Settings（API 配置）</div>
          <div class="card-body">
            <div class="form-row">
              <label>API Key</label>
              <input id="f-apikey" type="text" class="wide" placeholder="sk-…" />
            </div>
            <div class="form-row">
              <label>Base URL</label>
              <input id="f-baseurl" type="text" class="wide" placeholder="https://api.example.com/v1" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Models</div>
          <div class="card-body">
            <div class="models-header">
              <span id="model-count">0 个模型</span>
              <div style="display:flex;gap:6px">
                <button class="btn-sm warning" id="fetch-btn" onclick="openFetchModal()" title="从 Base URL 拉取可用模型列表">🔍 获取模型</button>
                <button class="btn-sm" onclick="addModelRow()">＋ 添加模型</button>
              </div>
            </div>
            <div id="models-container"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Raw JSON View -->
    <div id="view-raw" style="display:none">
      <textarea id="raw-editor" spellcheck="false"
        oninput="onRawInput()" onkeydown="handleRawTab(event)"></textarea>
      <div class="raw-status" id="raw-status">就绪</div>
    </div>

    <!-- Action bar -->
    <div class="action-bar">
      <button class="btn-primary" id="save-btn" onclick="save()">💾 保存</button>
      <button class="btn-primary" style="background:var(--surface2);border:1px solid var(--border);"
        onclick="reload()">🔄 重新加载</button>
      <span id="save-status" style="font-size:12px; color:var(--text-muted); align-self:center;"></span>
    </div>
  </main>
</div>

<!-- ── Add Provider Modal ── -->
<div class="overlay" id="add-modal">
  <div class="modal">
    <h3>➕ 新增 Provider</h3>
    <div class="form-row"><label>ID（键名）</label><input id="m-id" type="text" placeholder="my-provider" /></div>
    <div class="form-row"><label>名称</label><input id="m-name" type="text" placeholder="My Provider" /></div>
    <div class="form-row"><label>Package</label><input id="m-package" type="text" value="@opencode/ai/providers/openai-compatible" /></div>
    <div class="form-row"><label>API Key</label><input id="m-apikey" type="text" placeholder="sk-…" /></div>
    <div class="form-row"><label>Base URL</label><input id="m-baseurl" type="text" placeholder="https://…/v1" /></div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeAddModal()">取消</button>
      <button class="btn-primary" onclick="confirmAdd()">添加</button>
    </div>
  </div>
</div>

<!-- ── Copy Provider Modal ── -->
<div class="overlay" id="copy-modal">
  <div class="modal">
    <h3>📋 复制 Provider</h3>
    <div style="font-size:12px;color:var(--text-muted);margin-top:-4px" id="copy-source-label"></div>
    <div class="form-row">
      <label>新 ID</label>
      <input id="copy-new-id" type="text" placeholder="new-provider-id"
             oninput="validateCopyId()" />
    </div>
    <div class="form-row">
      <label>新名称</label>
      <input id="copy-new-name" type="text" placeholder="New Provider Name" />
    </div>
    <div id="copy-id-error" style="font-size:12px;color:var(--danger);min-height:16px;margin-top:-4px"></div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeCopyModal()">取消</button>
      <button class="btn-primary" id="copy-confirm-btn" onclick="confirmCopy()">复制</button>
    </div>
  </div>
</div>

<!-- ── Fetch Models Modal ── -->
<div class="overlay" id="fetch-modal">
  <div class="modal" style="gap:14px">
    <div style="display:flex;align-items:center;gap:10px">
      <h3 style="flex:1">🔍 从接口获取模型</h3>
      <span id="fetch-spinner" class="spinner" style="display:none"></span>
    </div>
    <div style="font-size:12px;color:var(--text-muted)" id="fetch-url-label"></div>

    <!-- Search -->
    <div class="fetch-search-wrap">
      <span class="search-icon">🔎</span>
      <input id="fetch-search" type="text" placeholder="搜索模型 ID…" oninput="filterPickList()" />
    </div>

    <!-- Toolbar: select all / count -->
    <div class="fetch-toolbar">
      <button class="btn-sm" onclick="pickToggleAll(true)">全选</button>
      <button class="btn-sm" onclick="pickToggleAll(false)">取消全选</button>
      <span class="pick-count" id="pick-count">0 个模型</span>
      <span id="pick-selected-count" style="font-size:12px;color:var(--accent)"></span>
    </div>

    <!-- List -->
    <div class="model-pick-list" id="model-pick-list">
      <div class="pick-empty">点击「获取」按钮拉取模型列表</div>
    </div>

    <div class="modal-actions">
      <button class="btn-sm" onclick="closeFetchModal()">取消</button>
      <button class="btn-primary" onclick="confirmFetchModels()" id="pick-confirm-btn" disabled>添加选中模型</button>
    </div>
  </div>
</div>

<!-- ── Toast Container ── -->
<div class="toast-container" id="toast-container"></div>

<script>
// ════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════
let fullConfig = {};       // complete opencode.json
let providers = {};        // shorthand
let activeId = null;       // currently selected provider id
let currentTab = 'visual'; // 'visual' | 'raw'

// ════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════
async function init() {
  await reload();
}

async function reload() {
  try {
    const res = await fetch('/api/config');
    fullConfig = await res.json();
    providers = fullConfig.providers || {};
    renderList();
    if (activeId && providers[activeId]) {
      loadProvider(activeId);
    } else {
      activeId = null;
      showEmptyState();
    }
    if (currentTab === 'raw') syncRawFromConfig();
    showToast('✅ 配置已加载', 'success', 2000);
  } catch(e) {
    showToast('❌ 加载失败: ' + e.message, 'error');
  }
}

// ════════════════════════════════════════════════
// Sidebar list
// ════════════════════════════════════════════════
function renderList() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const list  = document.getElementById('provider-list');
  list.innerHTML = '';

  const ids = Object.keys(providers).sort();
  const filtered = query
    ? ids.filter(id => id.toLowerCase().includes(query) || (providers[id].name||'').toLowerCase().includes(query))
    : ids;

  filtered.forEach(id => {
    const p = providers[id];
    const div = document.createElement('div');
    div.className = 'provider-item' + (id === activeId ? ' active' : '');
    div.innerHTML = `
      <div style="flex:1;min-width:0">
        <div class="name">${p.name || id}</div>
        <div class="id">${id}</div>
      </div>
      <div class="item-actions">
        <button class="copy-btn" title="复制此 Provider" onclick="openCopyModal(event,'${id}')">📋</button>
        <button class="del-btn"  title="删除此 Provider" onclick="deleteProvider(event,'${id}')">✕</button>
      </div>
    `;
    div.onclick = (e) => {
      if (e.target.closest('.item-actions')) return;
      selectProvider(id);
    };
    list.appendChild(div);
  });
}

// ════════════════════════════════════════════════
// Provider select / edit
// ════════════════════════════════════════════════
function selectProvider(id) {
  if (currentTab === 'raw') return;  // raw mode: no sidebar selection
  saveCurrentEdits();  // auto-save current before switching
  activeId = id;
  renderList();
  loadProvider(id);
}

function loadProvider(id) {
  const p = providers[id] || {};
  document.getElementById('empty-state').style.display = 'none';
  const panel = document.getElementById('edit-panel');
  panel.style.display = 'flex';

  document.getElementById('edit-title').textContent = p.name || id;
  document.getElementById('edit-id-label').textContent = `ID: ${id}`;
  document.getElementById('f-name').value    = p.name    || '';
  document.getElementById('f-package').value = p.package || '@opencode/ai/providers/openai-compatible';
  const s = p.settings || {};
  document.getElementById('f-apikey').value  = s.apiKey  || '';
  document.getElementById('f-baseurl').value = s.baseURL || '';

  renderModels(p.models || {});
}

function showEmptyState() {
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('edit-panel').style.display  = 'none';
}

// ════════════════════════════════════════════════
// Models
// ════════════════════════════════════════════════
function renderModels(models) {
  const container = document.getElementById('models-container');
  container.innerHTML = '';
  const entries = Object.entries(models);
  document.getElementById('model-count').textContent = entries.length + ' 个模型';
  entries.forEach(([modelId, meta]) => {
    container.appendChild(makeModelRow(modelId, meta.name || ''));
  });
}

function makeModelRow(modelId, displayName) {
  const row = document.createElement('div');
  row.className = 'model-row';
  row.innerHTML = `
    <label>Model ID</label>
    <input type="text" class="model-id" value="${escHtml(modelId)}" placeholder="model-id" />
    <label>别名</label>
    <input type="text" class="model-name" value="${escHtml(displayName)}" placeholder="（可选）" />
    <button class="btn-sm danger" onclick="this.closest('.model-row').remove(); updateModelCount()">✕</button>
  `;
  return row;
}

function addModelRow() {
  const container = document.getElementById('models-container');
  container.appendChild(makeModelRow('', ''));
  updateModelCount();
}

function updateModelCount() {
  const n = document.querySelectorAll('.model-row').length;
  document.getElementById('model-count').textContent = n + ' 个模型';
}

// ════════════════════════════════════════════════
// Collect form data
// ════════════════════════════════════════════════
function collectCurrentProvider() {
  if (!activeId) return null;
  const models = {};
  document.querySelectorAll('.model-row').forEach(row => {
    const mid  = row.querySelector('.model-id').value.trim();
    const mname = row.querySelector('.model-name').value.trim();
    if (mid) models[mid] = mname ? { name: mname } : {};
  });
  return {
    name:    document.getElementById('f-name').value.trim(),
    package: document.getElementById('f-package').value.trim(),
    settings: {
      apiKey:  document.getElementById('f-apikey').value.trim(),
      baseURL: document.getElementById('f-baseurl').value.trim(),
    },
    models,
  };
}

function saveCurrentEdits() {
  if (!activeId) return;
  const data = collectCurrentProvider();
  if (data) providers[activeId] = data;
}

// ════════════════════════════════════════════════
// Delete provider
// ════════════════════════════════════════════════
async function deleteProvider(e, id) {
  e.stopPropagation();
  if (!confirm(`确定删除 Provider「${providers[id]?.name || id}」吗？`)) return;
  try {
    const res = await fetch(`/api/providers/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());
    delete providers[id];
    if (activeId === id) { activeId = null; showEmptyState(); }
    renderList();
    showToast(`🗑️ 已删除 ${id}`, 'success');
  } catch(ex) {
    showToast('❌ 删除失败: ' + ex.message, 'error');
  }
}

// ════════════════════════════════════════════════
// Copy Provider
// ════════════════════════════════════════════════
let copySourceId = null;

function openCopyModal(e, id) {
  e.stopPropagation();
  copySourceId = id;
  const src = providers[id];

  // Pre-fill: suggest "<id>-copy", increment if already exists
  let newId = `${id}-copy`;
  let n = 2;
  while (providers[newId]) { newId = `${id}-copy-${n++}`; }

  document.getElementById('copy-new-id').value   = newId;
  document.getElementById('copy-new-name').value = src?.name ? `${src.name} (副本)` : newId;
  document.getElementById('copy-source-label').textContent = `来源：${src?.name || id}（${id}）`;
  document.getElementById('copy-id-error').textContent = '';
  document.getElementById('copy-confirm-btn').disabled = false;
  document.getElementById('copy-modal').classList.add('show');
  document.getElementById('copy-new-id').focus();
  document.getElementById('copy-new-id').select();
}

function closeCopyModal() {
  document.getElementById('copy-modal').classList.remove('show');
  copySourceId = null;
}

function validateCopyId() {
  const val = document.getElementById('copy-new-id').value.trim();
  const errEl = document.getElementById('copy-id-error');
  const btn   = document.getElementById('copy-confirm-btn');
  if (!val) {
    errEl.textContent = 'ID 不能为空';
    btn.disabled = true;
  } else if (providers[val]) {
    errEl.textContent = `ID「${val}」已存在`;
    btn.disabled = true;
  } else {
    errEl.textContent = '';
    btn.disabled = false;
  }
}

async function confirmCopy() {
  if (!copySourceId) return;
  const newId   = document.getElementById('copy-new-id').value.trim();
  const newName = document.getElementById('copy-new-name').value.trim();
  if (!newId)          { document.getElementById('copy-id-error').textContent = 'ID 不能为空'; return; }
  if (providers[newId]) { document.getElementById('copy-id-error').textContent = `ID「${newId}」已存在`; return; }

  // Deep-clone the source, apply new name
  const cloned = JSON.parse(JSON.stringify(providers[copySourceId]));
  if (newName) cloned.name = newName;

  try {
    const res = await fetch(`/api/providers/${encodeURIComponent(newId)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cloned),
    });
    if (!res.ok) throw new Error(await res.text());
    providers[newId] = cloned;
    closeCopyModal();
    renderList();
    // Save current edits first, then switch to the new copy
    saveCurrentEdits();
    activeId = newId;
    renderList();
    loadProvider(newId);
    showToast(`📋 已复制为「${newId}」`, 'success');
  } catch(ex) {
    showToast('❌ 复制失败: ' + ex.message, 'error');
  }
}

// ════════════════════════════════════════════════
// Add Provider Modal
// ════════════════════════════════════════════════
function openAddModal() {
  document.getElementById('m-id').value = '';
  document.getElementById('m-name').value = '';
  document.getElementById('m-apikey').value = '';
  document.getElementById('m-baseurl').value = '';
  document.getElementById('add-modal').classList.add('show');
  document.getElementById('m-id').focus();
}
function closeAddModal() {
  document.getElementById('add-modal').classList.remove('show');
}
async function confirmAdd() {
  const id      = document.getElementById('m-id').value.trim();
  const name    = document.getElementById('m-name').value.trim();
  const pkg     = document.getElementById('m-package').value.trim();
  const apiKey  = document.getElementById('m-apikey').value.trim();
  const baseURL = document.getElementById('m-baseurl').value.trim();
  if (!id) { alert('ID 不能为空'); return; }
  if (!name) { alert('名称不能为空'); return; }

  const body = { name, package: pkg, settings: { apiKey, baseURL }, models: {} };
  try {
    const res = await fetch(`/api/providers/${encodeURIComponent(id)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    providers[id] = body;
    closeAddModal();
    renderList();
    selectProvider(id);
    showToast(`✅ 已添加 ${name}`, 'success');
  } catch(ex) {
    showToast('❌ 添加失败: ' + ex.message, 'error');
  }
}

// ════════════════════════════════════════════════
// Save
// ════════════════════════════════════════════════
async function save() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;

  try {
    if (currentTab === 'visual') {
      saveCurrentEdits();
      fullConfig.providers = providers;
      const res = await fetch('/api/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fullConfig),
      });
      if (!res.ok) throw new Error(await res.text());
    } else {
      // raw mode
      const text = document.getElementById('raw-editor').value;
      let parsed;
      try { parsed = JSON.parse(text); }
      catch(e) { showToast('❌ JSON 格式错误，无法保存', 'error'); btn.disabled=false; return; }
      const res = await fetch('/api/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(parsed),
      });
      if (!res.ok) throw new Error(await res.text());
      fullConfig = parsed;
      providers  = fullConfig.providers || {};
      renderList();
    }
    setStatus('✅ 已保存 ' + new Date().toLocaleTimeString());
    showToast('✅ 保存成功', 'success');
  } catch(ex) {
    showToast('❌ 保存失败: ' + ex.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(msg) {
  document.getElementById('save-status').textContent = msg;
}

// ════════════════════════════════════════════════
// Tab switch
// ════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (tab==='visual' && i===0) || (tab==='raw' && i===1));
  });
  document.getElementById('view-visual').style.display = tab === 'visual' ? 'flex' : 'none';
  document.getElementById('view-raw').style.display    = tab === 'raw'    ? 'flex' : 'none';
  if (tab === 'raw') {
    saveCurrentEdits();
    fullConfig.providers = providers;
    syncRawFromConfig();
  }
}

function syncRawFromConfig() {
  document.getElementById('raw-editor').value = JSON.stringify(fullConfig, null, 2);
  validateRaw();
}

// ════════════════════════════════════════════════
// Raw editor
// ════════════════════════════════════════════════
function onRawInput() { validateRaw(); }

function validateRaw() {
  const text   = document.getElementById('raw-editor').value;
  const status = document.getElementById('raw-status');
  try {
    JSON.parse(text);
    status.textContent = '✅ JSON 合法';
    status.className   = 'raw-status ok';
  } catch(e) {
    status.textContent = '❌ ' + e.message;
    status.className   = 'raw-status err';
  }
}

function handleRawTab(e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const ta = e.target;
  const start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + '  ' + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = start + 2;
}

// ════════════════════════════════════════════════
// Toast
// ════════════════════════════════════════════════
function showToast(msg, type='', duration=3000) {
  const c    = document.getElementById('toast-container');
  const div  = document.createElement('div');
  div.className = 'toast ' + type;
  div.textContent = msg;
  c.appendChild(div);
  setTimeout(() => div.remove(), duration);
}

// ════════════════════════════════════════════════
// Helpers
// ════════════════════════════════════════════════
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Close modal on overlay click
document.getElementById('add-modal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  if (e.key === 'Escape') { closeAddModal(); closeCopyModal(); closeFetchModal(); }
});

// ════════════════════════════════════════════════
// Fetch Models from API
// ════════════════════════════════════════════════
let fetchedModels = [];   // full list from API
let filteredModels = [];  // after search filter

function openFetchModal() {
  const baseURL = document.getElementById('f-baseurl').value.trim();
  if (!baseURL) {
    showToast('⚠️ 请先填写 Base URL', 'error');
    return;
  }
  document.getElementById('fetch-url-label').textContent = `接口：${baseURL}/models`;
  document.getElementById('fetch-search').value = '';
  document.getElementById('fetch-modal').classList.add('show');
  fetchModels(baseURL);
}

function closeFetchModal() {
  document.getElementById('fetch-modal').classList.remove('show');
}

async function fetchModels(baseURL) {
  const spinner = document.getElementById('fetch-spinner');
  const list    = document.getElementById('model-pick-list');
  const confirmBtn = document.getElementById('pick-confirm-btn');
  spinner.style.display = 'inline-block';
  confirmBtn.disabled   = true;
  list.innerHTML = '<div class="pick-empty">正在请求…</div>';

  const apiKey = document.getElementById('f-apikey').value.trim();
  try {
    // Use backend proxy to avoid CORS
    const res = await fetch('/api/proxy/models', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ baseURL, apiKey }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));

    fetchedModels = (data.data || data.models || data || [])
      .map(m => typeof m === 'string' ? { id: m } : m)
      .filter(m => m.id)
      .sort((a, b) => a.id.localeCompare(b.id));

    filterPickList();
    showToast(`✅ 获取到 ${fetchedModels.length} 个模型`, 'success');
  } catch(e) {
    list.innerHTML = `<div class="pick-empty" style="color:var(--danger)">❌ 请求失败：${escHtml(e.message)}</div>`;
    showToast('❌ 获取模型失败', 'error');
  } finally {
    spinner.style.display = 'none';
  }
}

function filterPickList() {
  const q = document.getElementById('fetch-search').value.toLowerCase();
  filteredModels = q
    ? fetchedModels.filter(m => m.id.toLowerCase().includes(q) || (m.owned_by||'').toLowerCase().includes(q))
    : fetchedModels;
  renderPickList();
}

function renderPickList() {
  const list = document.getElementById('model-pick-list');
  const confirmBtn = document.getElementById('pick-confirm-btn');

  if (filteredModels.length === 0) {
    list.innerHTML = fetchedModels.length === 0
      ? '<div class="pick-empty">暂无数据</div>'
      : '<div class="pick-empty">无匹配结果</div>';
    confirmBtn.disabled = true;
    document.getElementById('pick-count').textContent = '0 个模型';
    return;
  }

  // Get currently checked model IDs (preserve across re-render)
  const prevChecked = new Set(
    [...document.querySelectorAll('.pick-cb:checked')].map(cb => cb.dataset.id)
  );

  list.innerHTML = '';
  filteredModels.forEach(m => {
    const item = document.createElement('label');
    item.className = 'model-pick-item';
    const checked = prevChecked.has(m.id);
    item.innerHTML = `
      <input type="checkbox" class="pick-cb" data-id="${escHtml(m.id)}" ${checked ? 'checked' : ''} onchange="updatePickCount()" />
      <span class="pick-id">${escHtml(m.id)}</span>
      ${m.owned_by ? `<span class="pick-owner">${escHtml(m.owned_by)}</span>` : ''}
    `;
    list.appendChild(item);
  });

  document.getElementById('pick-count').textContent = `共 ${filteredModels.length} 个`;
  confirmBtn.disabled = false;
  updatePickCount();
}

function updatePickCount() {
  const n = document.querySelectorAll('.pick-cb:checked').length;
  const el = document.getElementById('pick-selected-count');
  el.textContent = n > 0 ? `已选 ${n} 个` : '';
  document.getElementById('pick-confirm-btn').disabled = (n === 0);
}

function pickToggleAll(checked) {
  document.querySelectorAll('.pick-cb').forEach(cb => cb.checked = checked);
  updatePickCount();
}

function confirmFetchModels() {
  const checked = [...document.querySelectorAll('.pick-cb:checked')].map(cb => cb.dataset.id);
  if (checked.length === 0) return;

  // Get existing model IDs to avoid duplicates
  const existing = new Set(
    [...document.querySelectorAll('.model-row .model-id')].map(el => el.value.trim())
  );
  const container = document.getElementById('models-container');
  let added = 0;
  checked.forEach(id => {
    if (!existing.has(id)) {
      container.appendChild(makeModelRow(id, ''));
      added++;
    }
  });
  updateModelCount();
  closeFetchModal();
  showToast(`✅ 已添加 ${added} 个模型${added < checked.length ? `（${checked.length - added} 个已存在）` : ''}`, 'success');
}

// ════════════════════════════════════════════════
// Boot
// ════════════════════════════════════════════════
init();
</script>
</body>
